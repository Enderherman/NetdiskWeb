worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    map $uri $netdisk_log_uri {
        default $uri;
        ~^/api/file/download/ "/api/file/download/[redacted]";
        ~^/api/file/downloadZip/ "/api/file/downloadZip/[redacted]";
        ~^/api/showShare/download/ "/api/showShare/download/[redacted]";
        ~^/api/admin/download/ "/api/admin/download/[redacted]";
    }
    log_format netdisk_minimal escape=json '{"method":"$request_method","uri":"$netdisk_log_uri","status":$status,"upstream_status":"$upstream_status","bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /dev/stdout netdisk_minimal;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 128m;
        client_body_timeout 300s;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api { return 308 /api/; }
        location = /api/qqlogin/callback {
            # OAuth parameters must not enter either access or upstream error logs.
            access_log off;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cache-Control;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            include /etc/nginx/proxy-api.conf;
        }
        location ^~ /api/ {
            include /etc/nginx/proxy-api.conf;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location = /index.html {
            expires -1;
            try_files $uri =404;
        }
        location ~ /\. { deny all; }
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
