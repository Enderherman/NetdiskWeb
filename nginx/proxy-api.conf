# Shared by ordinary API routes and the sensitive OAuth callback.
# No URI suffix: preserve the original /api path and query for the backend.
# Upstream error messages include raw URI/query. Use redacted access status instead.
error_log /dev/null;
set $netdisk_backend http://backend:7090;
proxy_pass $netdisk_backend;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
proxy_set_header Range $http_range;
proxy_set_header If-Range $http_if_range;
proxy_set_header Accept-Encoding "";
proxy_connect_timeout 10s;
proxy_send_timeout 300s;
proxy_read_timeout 3600s;
send_timeout 3600s;
proxy_request_buffering off;
proxy_buffering off;
proxy_cache off;
proxy_intercept_errors off;
gzip off;
